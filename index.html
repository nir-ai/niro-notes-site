<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Niro Notes, an iPad app for handwritten notes on squared paper and PDFs.">
<title>Niro Notes</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #1c1c1e;
    --muted: #66625b;
    --accent: #1f5fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --text: #f2f2f7;
      --muted: #a8a49c;
      --accent: #7ea6ff;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  main { max-width: 680px; margin: 0 auto; padding: 64px 16px 56px; }
  h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .lead { color: var(--muted); font-size: 1.1rem; margin-bottom: 28px; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 8px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Niro Notes</h1>
  <p class="lead">Handwritten notes on squared paper and PDFs, for iPad and Apple Pencil.</p>
  <ul>
    <li><a href="privacy/">Privacy Policy</a></li>
    <li>Support: <a href="mailto:support@elniro.com">support@elniro.com</a></li>
  </ul>
</main>
</body>
</html>
